name: Build Oneplus 8 Series (OxygenOS 11 A11) (XTD Kernel)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8_cn"
  DEVICE_CODENAME : "instantnoodle"

  CUSTOM_CMDS : "BRAND_SHOW_FLAG=oneplus CLANG_TRIPLE=aarch64-linux-gnu-"
  # Coherent clang + LLVM-binutils + GNU-assembler toolchain.
  #  - LD=ld.lld, AR/NM/OBJCOPY/OBJDUMP/STRIP/READELF=llvm-*: this 4.19 tree
  #    defaults these to $(CROSS_COMPILE)* = ancient Google GCC-4.9 (2016)
  #    binutils, which mis-handle clang-19 output. Use the LLVM 19.1.7 tools
  #    (on PATH via clang-custom/bin) instead.
  #  - CROSS_COMPILE points at the private /tmp/cc{64,32} dirs built in the
  #    toolchain step. The kernel Makefile derives GCC_TOOLCHAIN_DIR from
  #    `which $(CROSS_COMPILE)elfedit` and passes --prefix=<dir> to clang;
  #    clang -no-integrated-as then runs getProgramPath("as") = <dir>/as. In
  #    those dirs the BARE `as` is the arm64/arm32 GNU cross assembler (in
  #    /usr/bin bare `as` is the host x86 one, which rejects "-EL"). 4.19 arm64
  #    asm (e.g. the vdso) is GAS-only — LLVM's integrated assembler can't build
  #    it — so we need a real GNU as. make CLI vars override the env the harness
  #    exports.
  #  - KCFLAGS=-Wno-error: this 4.19 code was written for ~clang-12; clang-19
  #    promotes many legacy constructs to errors via the tree's global
  #    -Werror=strict-prototypes / -Werror=implicit-* (Makefile ~L942-954).
  #    $(KCFLAGS) is appended after those, so a blanket -Wno-error demotes them
  #    back to warnings tree-wide (no per-file patching). Hard errors are
  #    unaffected.
  EXTRA_CMDS : "LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf CROSS_COMPILE=/tmp/cc64/aarch64-linux-gnu- CROSS_COMPILE_ARM32=/tmp/cc32/arm-linux-gnueabi- CROSS_COMPILE_COMPAT=/tmp/cc32/arm-linux-gnueabi- KCFLAGS=-Wno-error"

  # ppajda's tree is the native base the kona_oos/susfs_fixed patch set is
  # tuned for; the official OnePlusOSS tree made susfs hunks reject (silently,
  # via `patch ... || true`), leaving fs/namei.c referencing undefined SUSFS
  # symbols. Keep the patch-compatible source; the panel/KPM hypotheses are
  # addressed by DEFCONFIG_NAME (kona-perf) + KPM off, not by the source.
  # Verified vendor/kona-perf_defconfig exists on ppajda oos11.
  KERNEL_SOURCE : "https://github.com/ppajda/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "oos11"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_64_BRANCH : "aarch64"
  GCC_32_SOURCE : "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_32_BRANCH : "arm32"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk , next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/JackA1ltman/OP8_AnyKernel3.git"
  AK3_BRANCH : "main"

  BOOT_SOURCE : "https://github.com/raredogecreator-cloud/NonGKI_Kernel_Build_2nd/releases/download/bootimg/stock_boot_IN2021_15_200930.img"

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oxygen11_a11"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "MKBOOTIMG" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "op_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "kona_oos" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "true" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "true" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Oneplus 8 Series (OxygenOS 11 A11) (XTD Kernel)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_CPU_BIG_ENDIAN=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_COMPAT_VDSO=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_LTO_NONE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_INIT_STACK_NONE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_BUILD_ARM64_DT_OVERLAY=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          # echo "CONFIG_KPROBES=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i 's/# CONFIG_SECCOMP is not set/CONFIG_SECCOMP=y/' ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

          # If u want to upgrade SuSFS to 1510 and high.
          # echo "CONFIG_AUDIT=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

          # sed -i 's|\$(obj)/config_data.gz: [^ ]* FORCE|\$(obj)/config_data.gz: $(KCONFIG_CONFIG) FORCE|' kernel/Makefile

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🩹 Toolchain setup & compat fixes (GNU cross-as + host dtc)
        shell: bash
        run: |
          # 4.19 arm64 is built clang + external GNU `as` (LLVM's integrated
          # assembler cannot build this tree's hand-written asm, e.g. vdso
          # note.S/gettimeofday.S which use GAS-only macro/section syntax).
          # Install modern, triple-matching binutils.
          sudo apt-get update -y
          sudo apt-get install -y binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          # Private cross-tool dirs whose BARE `as` is the GNU cross assembler.
          # Why: the kernel Makefile passes --prefix=$(dir `which $(CROSS_COMPILE)elfedit`)
          # to clang, and clang -no-integrated-as runs getProgramPath("as") =
          # <prefix>/as. Ubuntu installs the cross tools in /usr/bin only under
          # triple names (aarch64-linux-gnu-as); bare /usr/bin/as is the HOST x86
          # assembler, which rejects "-EL". Pointing CROSS_COMPILE at these dirs
          # makes --prefix resolve here, so <prefix>/as is the real cross as.
          # Symlink both bare and triple names (clang may use either form).
          build_cc_dir() { # $1=dir  $2=triple-prefix
            mkdir -p "$1"
            for t in as ld ar nm objcopy objdump ranlib strip readelf elfedit addr2line size strings; do
              s=$(command -v "$2$t" || true)
              { [ -n "$s" ] && ln -sf "$s" "$1/$t" && ln -sf "$s" "$1/$2$t"; } || true
            done
            echo "== $1 =="; ls -l "$1"
          }
          build_cc_dir /tmp/cc64 aarch64-linux-gnu-
          build_cc_dir /tmp/cc32 arm-linux-gnueabi-
          echo "bare as resolves to:"; /tmp/cc64/as --version | head -1

          cd "$GITHUB_WORKSPACE/device_kernel"

          # Host dtc: 4.19's scripts/dtc/dtc-lexer.l has a tentative
          # "YYLTYPE yylloc;" that collides with the dtc-parser definition under
          # modern host GCC's -fno-common default (HOSTLD scripts/dtc/dtc:
          # "multiple definition of 'yylloc'"). Mark it extern. No .lex.c_shipped
          # in this tree, so patching the .l is enough (LEX regenerates the .lex.c).
          DTC_LEXER="scripts/dtc/dtc-lexer.l"
          echo "dtc before:"; grep -n 'YYLTYPE yylloc;' "$DTC_LEXER" || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$DTC_LEXER"
          echo "dtc after:"; grep -n 'yylloc;' "$DTC_LEXER" || true

          # cpuset: ppajda's tree adds a CONFIG_CPUSET_ASSIST feature whose
          # `struct cs_target` (and its uses) are #ifdef-guarded, but the helper
          # cpuset_write_resmask_assist() — which takes that struct BY VALUE — is
          # left OUTSIDE the guard. With kona-perf_defconfig (CPUSET_ASSIST off)
          # the struct is undefined there: "variable has incomplete type
          # 'struct cs_target'". The function is only ever called from inside the
          # existing #ifdef CONFIG_CPUSET_ASSIST block, so guard its definition
          # too (makes the file compile whether the feature is on or off).
          echo "cpuset before:"; grep -n 'cpuset_write_resmask_assist' kernel/cgroup/cpuset.c || true
          perl -0777 -i -pe 's/(static ssize_t cpuset_write_resmask_assist\(.*?\n\}\n)/#ifdef CONFIG_CPUSET_ASSIST\n${1}#endif\n/s' kernel/cgroup/cpuset.c
          echo "cpuset after:"; grep -n 'CONFIG_CPUSET_ASSIST\|cpuset_write_resmask_assist' kernel/cgroup/cpuset.c | head

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
