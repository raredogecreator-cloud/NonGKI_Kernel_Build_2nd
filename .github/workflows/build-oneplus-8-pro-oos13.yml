name: Build Oneplus 8 Pro (OxygenOS 13.1 A13) (Realking opkona)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8_cn"
  DEVICE_CODENAME : "instantnoodlep"

  CUSTOM_CMDS : "BRAND_SHOW_FLAG=oneplus CLANG_TRIPLE=aarch64-linux-gnu-"
  # Same Proton clang 13 toolchain mapping that produced the known-booting A11
  # build on this device. Realking's tree is also a 4.19 OnePlus/Oplus tree
  # (4.19.322, descends from the same kona lineage), so the same GAS/lld/CRC
  # fixups are the right starting point.
  EXTRA_CMDS : "LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS=-Wno-error"

  # OFFICIAL OnePlus stock kernel source (OnePlusOSS), op8 / Android-13 (T) branch.
  # This IS the kernel OnePlus ships -> boots on stock OOS13 by definition. Realking
  # opkona (a CUSTOM kernel) early-panicked on stock OOS13; the source was the
  # problem, not the defconfig. Bonus: official source has NO bundled KernelSU, so
  # the duplicate-symbol issue can't occur.
  KERNEL_SOURCE : "https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "oneplus/sm8250_t_13.1_op8"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "20210522"

  GCC_GNU : false
  GCC_64_SOURCE : "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_64_BRANCH : "aarch64"
  GCC_32_SOURCE : "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_32_BRANCH : "arm32"

  DEFCONFIG_SOURCE: ""
  # OnePlus's real RETAIL/production config IN THE OFFICIAL TREE. In OnePlusOSS,
  # vendor/kona-perf_defconfig is the shipping ("perf") build config for op8 --
  # i.e. exactly what produced the stock kernel on the device. (NOT the same as
  # Realking's modified kona-perf that panicked: same name, different source.)
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  # STEP 1 (this build): SUSFS OFF. The opkona tree's drivers/Makefile
  # unconditionally references drivers/ksu/, so KSU_INSTALL must be on
  # (auto-fetches ReSukiSU) just to make the tree buildable. SUSFS gets
  # layered in step 2 -> confirm this boots via `fastboot boot` first,
  # same as the A11 sequence.
  KSU_INSTALL : "true"
  SUSFS_ENABLE : false
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/JackA1ltman/OP8_AnyKernel3.git"
  AK3_BRANCH : "main"

  # Stock IN2021_13.1.0.590(EX01) boot.img, MD5-verified against OnePlus's
  # published 309ff476170e0e5233214d3b271a2436, extracted from the full OTA zip
  # and uploaded as a release asset (same pattern as the A11 boot.img).
  BOOT_SOURCE : "https://github.com/raredogecreator-cloud/NonGKI_Kernel_Build_2nd/releases/download/bootimg/stock_boot_IN2021_13.1.0.590_EX01.img"

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oxygen13.1_a13"

  PYTHON_VERSION: "3"

  PACK_METHOD: "MKBOOTIMG"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "op_kernel"

  SUSFS_FOLDER_FIXED: "kona_oos"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  # OFF for the bare boot test -- same reasoning as A11 step 1: isolate
  # variables one at a time.
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Oneplus 8 Pro (OxygenOS 13.1 A13) (Realking opkona)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        if: env.KSU_INSTALL != 'false'
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_CPU_BIG_ENDIAN=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_COMPAT_VDSO=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_LTO_NONE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_INIT_STACK_NONE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_BUILD_ARM64_DT_OVERLAY=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          # Force RAW uncompressed Image: kona-perf_defconfig defaults to GZIP
          # (build_kernel.sh copies Image.gz), but the stock 8 Pro boot.img carries
          # a raw Image and our MKBOOTIMG repack feeds the kernel as-is -> must be
          # raw to boot.
          echo "# CONFIG_BUILD_ARM64_KERNEL_COMPRESSION_GZIP is not set" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          # Seccomp: force ON (perf configs sometimes drop it; a real OOS device
          # has seccomp -> disabled is both a detection signal and a stability risk).
          sed -i -E '/^(# )?CONFIG_SECCOMP( is not set|=)/d' ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_SECCOMP=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          # Persistent early logging so a black-screen panic survives a reboot
          # (ramoops/pstore + console + pmsg, symbols, no panic auto-reboot).
          echo "CONFIG_PSTORE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_PSTORE_CONSOLE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_PSTORE_RAM=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_PSTORE_PMSG=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_PSTORE_DEFLATE_COMPRESS=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_DEBUG_INFO=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_PANIC_TIMEOUT=0" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🩹 Toolchain compat fixes (tree patches)
        shell: bash
        run: |
          # Same OnePlus/Oplus 4.19 lineage as the proven A11 build, so it needs
          # the same source fixups to compile clean with Proton clang + lld.
          cd "$GITHUB_WORKSPACE/device_kernel"

          # WireGuard: net/Kconfig may `source net/wireguard/Kconfig` from a
          # subtree fetched at defconfig time (flaky under CI). We don't use it
          # (proxy handled in userspace). If absent, strip the dangling source +
          # config so kconfig parses deterministically.
          if [ ! -f net/wireguard/Kconfig ]; then
            echo "net/wireguard absent -> removing dangling Kconfig source + disabling CONFIG_WIREGUARD"
            sed -i '\#net/wireguard/Kconfig#d' net/Kconfig
            sed -i '/CONFIG_WIREGUARD/d' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          fi

          # Host dtc: 4.19's dtc-lexer.l has a tentative "YYLTYPE yylloc;" that
          # collides under modern host GCC -fno-common ("multiple definition of
          # 'yylloc'"). Mark extern.
          DTC_LEXER="scripts/dtc/dtc-lexer.l"
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$DTC_LEXER"

          # cpuset: CONFIG_CPUSET_ASSIST's `struct cs_target` is #ifdef-guarded but
          # the helper cpuset_write_resmask_assist() (takes it BY VALUE) is left
          # OUTSIDE the guard -> "incomplete type 'struct cs_target'" when the
          # feature is off. The fn is only called from inside the existing
          # #ifdef block, so guard its definition too (compiles either way).
          echo "cpuset before:"; grep -n 'cpuset_write_resmask_assist' kernel/cgroup/cpuset.c || true
          perl -0777 -i -pe 's/(static ssize_t cpuset_write_resmask_assist\(.*?\n\}\n)/#ifdef CONFIG_CPUSET_ASSIST\n${1}#endif\n/s' kernel/cgroup/cpuset.c
          echo "cpuset after:"; grep -n 'CONFIG_CPUSET_ASSIST\|cpuset_write_resmask_assist' kernel/cgroup/cpuset.c | head || true

          # SUSFS reject (fs/namei.c): base susfs patch's "#include
          # <linux/susfs_def.h>" hunk rejects because OnePlus inserted a
          # "#ifdef CONFIG_FSC" block right after <linux/build_bug.h>. The other
          # namei.c hunks applied and use susfs_def.h macros, so the include is
          # REQUIRED to compile. Re-add it after build_bug.h.
          if ! grep -q 'linux/susfs_def.h' fs/namei.c; then
            perl -0777 -i -pe 's{(#include <linux/build_bug.h>\n)}{$1#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif\n}' fs/namei.c
          fi
          echo "namei.c susfs include:"; grep -n 'susfs_def.h' fs/namei.c || true

          # ReSukiSU integration guard: KernelSU/kernel/tools/static_export_check.mk
          # aborts ("You should integrate ReSukiSU") unless CONFIG_KALLSYMS_ALL is
          # set OR sel_handle_status_ops is GLOBAL. kona-perf_defconfig has
          # KALLSYMS_ALL off, so drop `static` instead. ReSukiSU's selinux_hide.c
          # references BOTH sel_handle_status_ops AND the write_op[] dispatch table
          # via extern (both `static` in this tree -> ld.lld undefined symbol).
          echo "selinuxfs before:"; grep -nE 'sel_handle_status_ops|write_op\[\]' security/selinux/selinuxfs.c || true
          sed -i \
            -e 's/^static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/' \
            -e 's/^static ssize_t (\*const write_op\[\])/ssize_t (*const write_op[])/' \
            security/selinux/selinuxfs.c
          echo "selinuxfs after:"; grep -nE 'sel_handle_status_ops|write_op\[\]' security/selinux/selinuxfs.c || true

          # Duplicate KernelSU: opkona BUNDLES its own KernelSU
          # (drivers/Makefile: "obj-$(CONFIG_KSU) += ksu/" + drivers/Kconfig
          # "config KSU"). The NonGKI pipeline ALSO symlinks ReSukiSU to
          # drivers/kernelsu and appends "obj-$(CONFIG_KSU) += kernelsu/". Under
          # CONFIG_KSU=y BOTH compile -> ld.lld duplicate symbol: kernelsu_init,
          # ksu_cred, ... at the vmlinux link. (Radioactive/A11 had no bundled KSU
          # so never hit this.) Keep ONLY the pipeline's ReSukiSU: drop the tree's
          # bundled ksu/ from the build. Touch ONLY the Makefile line (anchored,
          # won't match "kernelsu/") -- NOT the Kconfig menu, because the pipeline
          # inserts ReSukiSU's "source drivers/kernelsu/Kconfig" inside that same
          # menu and removing the block could un-wire ReSukiSU.
          echo "drivers/Makefile ksu before:"; grep -nE '(^|[[:space:]])ksu/|kernelsu/' drivers/Makefile || true
          sed -i -E '/\+=[[:space:]]+ksu\/$/d' drivers/Makefile
          echo "drivers/Makefile ksu after:"; grep -nE '(^|[[:space:]])ksu/|kernelsu/' drivers/Makefile || true

          # clang vs 4.19 legacy: tree promotes several warnings to HARD errors via
          # specific -Werror=<w>. A blanket KCFLAGS=-Wno-error does NOT override a
          # specific -Werror=<w> (only -Wno-error=<w> does). Demote them tree-wide.
          sed -i 's/-Werror=/-Wno-error=/g; s/-Werror-implicit-function-declaration/-Wno-error=implicit-function-declaration/g' Makefile
          # Strip blanket per-directory -Werror (some vendor dirs append a bare
          # -Werror AFTER our flags, re-promoting warnings to hard errors).
          find . \( -name Makefile -o -name Kbuild \) -print0 | xargs -0 -r sed -i -E 's/-Werror([[:space:]]|$)/\1/g'

          # vmlinux LINK shims for clang+lld on this 4.19 tree (confirmed with
          # Proton clang-13/lld-13, NOT version-specific):
          # (a) clang synthesizes stpcpy()/stpncpy() libcalls 4.19 doesn't define
          #     -> "ld.lld: undefined symbol: stpcpy". Mark non-builtin.
          sed -i '/\$(KCFLAGS)/a KBUILD_CFLAGS += -fno-builtin-stpcpy -fno-builtin-stpncpy' Makefile
          # (b) CONFIG_MODVERSIONS emits __crc_<sym> via R_AARCH64_ABS32 which
          #     ld.lld rejects in the PIE vmlinux link. Disable module CRC
          #     versioning (in-tree modules unaffected; vermagic still guards).
          sed -i 's/^CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "modversions:"; grep -n 'MODVERSIONS' arch/arm64/configs/${{ env.DEFCONFIG_NAME }} || true

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🧹 Drop empty built DTB (reuse stock boot.img DTB)
        shell: bash
        run: |
          # opkona's build emits an EMPTY arch/arm64/boot/dtb (the kona dtb CAT
          # target has no boards selected for our config -> 0 bytes). The packer
          # picks it up ("Found DTB!") and mkbootimg aborts:
          #   ValueError: DTB image must not be empty.
          # Radioactive/A11 produced NO dtb, so the packer fell through and
          # mkbootimg REUSED the stock boot.img's valid OEM A13 DTB -- exactly
          # what we want for a kernel-only swap. Replicate that: delete any
          # empty dtb so the stock one is kept.
          D="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
          for f in "$D/dtb" "$D/dtb.img"; do
            if [ -f "$f" ] && [ ! -s "$f" ]; then echo "removing empty $(basename $f)"; rm -f "$f"; fi
          done
          ls -la "$D"/dtb "$D"/dtb.img 2>/dev/null || echo "no built dtb remains -> stock boot.img DTB will be reused"

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
